<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD's JEWELLERY</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>   

</head>
<body>

   <!-- Header / Navbar Section -->
    <header class="navbar">
        <div class="logo">MD's<span>Jewellery</span></div>
        <nav class="nav-menu">
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#collections">Collections</a></li>
                <li><a href="#reviews">Reviews</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
        
        
        <div class="nav-icons">
            <input type="text" name="search" placeholder="Search...">
            <a href="#"><i class="fas fa-search"></i></a>
            <a href="#" class="cart-icon"></a><i class='bx bxs-cart-add'></i><span class="badge">0</span></a>
        </div>
    </div>
</header>
    <!-- Contact Section -->
    <section id="contact" class="contact-section">
        <div class="contact-container">
            <h2>CONTACT US</h2>
            <p>Schedule a private consultation or reach out with your customization requests.</p>
            <form class="contact-form">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="How can we assist you?" rows="5" required></textarea>
                <button type="submit" class="btn-primary">Send Message</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 MD's Jewellery. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
